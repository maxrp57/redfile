<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dossier Secret</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--noir:#05060d;--nuit:#0b1230;--nuit2:#151d4a;--or:#e0b252;--or2:#9c7a2e;--violet:#7a5cf0;--violet2:#2a1f66;--txt:#ece8f7;--muted:#9aa2cf;--P:#8d6bff;--E:#2fb4d6;--A:#e0b252;--ok:#4ed39a;--bad:#ff6b7a;--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--noir);color:var(--txt);font-family:var(--sans);font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--or);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}
.screen{position:absolute;inset:0;display:none;overflow:auto}
.screen.active{display:block}
h1,h2,h3,h4{font-family:var(--serif);margin:0;font-weight:700}
.btn{border:1px solid rgba(224,178,82,.45);background:linear-gradient(180deg,#1a2257,#10173d);padding:.75em 1.3em;border-radius:12px;font-weight:600;letter-spacing:.01em;transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 22px rgba(224,178,82,.25)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gold{background:linear-gradient(180deg,#f0c767,#c0932f);color:#1a1202;border-color:#f6d98c}
.btn.ghost{background:transparent}
.btn.small{padding:.4em .8em;font-size:.85rem;border-radius:9px}
/* MENU */
.bg{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 28% 8%,rgba(224,178,82,.24),transparent 46%),radial-gradient(ellipse at 85% 95%,rgba(122,92,240,.28),transparent 52%),linear-gradient(160deg,#0b1230,#05060d 72%)}
.cone{position:absolute;top:-10%;left:14%;width:60%;height:90%;background:linear-gradient(180deg,rgba(255,226,150,.16),transparent 80%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);filter:blur(10px);animation:flick 7s infinite}
@keyframes flick{0%,100%{opacity:.9}46%{opacity:.75}48%{opacity:1}52%{opacity:.7}54%{opacity:.95}}
.doc{position:absolute;width:150px;height:195px;border:1px solid rgba(224,178,82,.22);background:linear-gradient(160deg,rgba(236,226,190,.07),rgba(236,226,190,.02));border-radius:6px;animation:drift 22s ease-in-out infinite alternate}
.doc::before{content:"CONFIDENTIEL";position:absolute;top:16px;left:-8px;right:-8px;text-align:center;font-family:var(--serif);font-size:15px;color:rgba(224,100,100,.45);border:2px solid rgba(224,100,100,.35);transform:rotate(-8deg);padding:2px}
.doc::after{content:"";position:absolute;left:14px;right:14px;top:70px;height:90px;background:repeating-linear-gradient(180deg,rgba(236,226,190,.18) 0 2px,transparent 2px 12px)}
@keyframes drift{from{transform:translate(0,0) rotate(var(--r))}to{transform:translate(24px,-34px) rotate(calc(var(--r) + 5deg))}}
.lens{position:absolute;width:190px;height:190px;right:10%;bottom:12%;animation:lens 16s ease-in-out infinite alternate;opacity:.55}
@keyframes lens{from{transform:translate(0,0) rotate(-10deg)}to{transform:translate(-160px,-90px) rotate(14deg)}}
.menu-wrap{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;gap:34px;text-align:center}
.logo{font-size:clamp(3rem,10vw,6rem);line-height:.95;letter-spacing:.01em;text-shadow:0 0 40px rgba(224,178,82,.35)}
.logo small{display:block;font-family:var(--sans);font-size:.9rem;font-weight:400;color:var(--muted);letter-spacing:.04em;margin-top:14px}
.menu-list{display:flex;flex-direction:column;gap:12px;width:min(340px,90vw)}
.menu-list .btn{font-size:1.05rem;padding:.9em 1em}
.menu-list .btn.gold{font-size:1.2rem}
.panel{position:relative;max-width:820px;margin:0 auto;padding:28px 20px 60px}
.panel h2{font-size:2.2rem;margin-bottom:18px}
.panel h3{font-size:1.5rem;margin:26px 0 8px;color:var(--or)}
.panel p,.panel li{line-height:1.6;color:#d6d3ec}
.panel .sentence{font-family:var(--serif);font-size:1.25rem;color:var(--or)}
.back{position:sticky;top:0;z-index:5;padding:10px 0;background:linear-gradient(180deg,var(--noir) 60%,transparent)}
/* SETUP */
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field label,.lbl{font-weight:600;color:var(--muted);font-size:.9rem}
input[type=text],select,textarea{background:#0e1538;color:var(--txt);border:1px solid #2c3677;border-radius:10px;padding:.65em .8em;font:inherit;min-width:0;width:100%}
.segs{display:flex;gap:8px;flex-wrap:wrap}
.seg{flex:1;min-width:48px;padding:.7em;border-radius:10px;border:1px solid #2c3677;background:#0e1538;text-align:center;font-weight:700}
.seg.on{background:linear-gradient(180deg,#f0c767,#c0932f);color:#1a1202;border-color:#f6d98c}
.avs{display:flex;gap:6px;flex-wrap:wrap}
.avb{width:46px;height:46px;border-radius:50%;border:2px solid transparent;background:#0e1538;font-size:1.5rem;padding:0;display:grid;place-items:center}
.avb.on{border-color:var(--or);box-shadow:0 0 14px rgba(224,178,82,.5)}
.botrow{display:grid;grid-template-columns:56px 1fr 120px;gap:8px;align-items:center;background:#0c1334;border:1px solid #232c6a;border-radius:12px;padding:8px;margin:8px 0}
.botrow select.av{font-size:1.5rem;padding:.3em}
.toggles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:12px 0}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0e1538;border:1px solid #2c3677;border-radius:10px;padding:.7em .9em;text-align:left;width:100%}
.tg i{width:38px;height:22px;border-radius:12px;background:#2a3170;position:relative;flex:none;transition:background .2s}
.tg i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on i{background:var(--ok)}.tg.on i::after{transform:translateX(16px)}
.hint{color:var(--muted);font-size:.85rem;line-height:1.5}
/* STATS */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:#0c1334;border:1px solid #232c6a;border-radius:12px;padding:14px}
.kpi b{display:block;font-family:var(--serif);font-size:2rem;color:var(--or)}
.kpi span{color:var(--muted);font-size:.85rem}
.hist{list-style:none;padding:0;margin:0}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid #1f2760}
.ach{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid #232c6a;border-radius:12px;margin:8px 0;background:#0c1334}
.ach.lock{opacity:.45}.ach span{font-size:1.6rem}
/* CARDS */
.card{--w:104px;width:var(--w);height:calc(var(--w)*1.4);font-size:calc(var(--w)/10);display:inline-block;flex:none;perspective:900px;border-radius:.9em}
.card .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.card.down .inner{transform:rotateY(180deg)}
.card .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:inherit;overflow:hidden}
.card .front{background:linear-gradient(165deg,#f6f0dd,#e4d9b6);color:#1b1630;border:.2em solid var(--acc);box-shadow:0 .5em 1.4em rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;padding:.5em .4em .6em;text-align:center}
.card .band{align-self:stretch;background:var(--acc);color:#fff;font-weight:800;font-size:.78em;border-radius:.5em;padding:.25em;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.card .emb{flex:1;display:grid;place-items:center;font-size:3.1em;line-height:1;filter:drop-shadow(0 .1em .1em rgba(0,0,0,.25))}
.card .ttl{font-family:var(--serif);font-weight:700;font-size:1.28em;line-height:1.05;min-height:2.1em;display:flex;align-items:center;justify-content:center}
.card .ttl.long{font-size:1.05em}
.card .back{transform:rotateY(180deg);background:radial-gradient(circle at 50% 40%,#3a2a8c,#150f3d);border:.2em solid var(--or);display:grid;place-items:center;box-shadow:0 .5em 1.4em rgba(0,0,0,.5)}
.card .back::before{content:"";position:absolute;inset:.45em;border:1px solid rgba(224,178,82,.6);border-radius:.6em;background:repeating-linear-gradient(45deg,rgba(224,178,82,.1) 0 .4em,transparent .4em .8em)}
.card .back::after{content:"DS";font-family:var(--serif);font-weight:700;font-size:2.4em;color:var(--or)}
.cat-P{--c:var(--P)}.cat-E{--c:var(--E)}.cat-A{--c:var(--A)}
/* GAME */
#game{background:radial-gradient(ellipse at 50% -10%,#1a2257,#070a1c 60%)}
#game.active{display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid #1f2760;background:rgba(5,6,13,.7);flex:none}
.topbar .ttl{font-family:var(--serif);font-size:1.4rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:1px solid #2c3677;background:#0e1538;border-radius:10px;padding:.5em .75em;font-weight:600;font-size:.88rem}
.ib.on{border-color:var(--or);color:var(--or)}
.gamebody{flex:1;min-height:0;display:flex;position:relative}
.stage{flex:1;min-width:0;overflow-y:auto;padding:8px 10px 16px;display:flex;flex-direction:column;gap:8px}
.table{position:relative;width:100%;max-width:900px;margin:0 auto;aspect-ratio:16/10;flex:none}
.felt{position:absolute;inset:11% 7%;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,#2a2f8a,#141a52 55%,#0a0d30);border:6px solid #3a2a12;box-shadow:0 0 0 2px var(--or2),0 30px 60px rgba(0,0,0,.7),inset 0 0 60px rgba(0,0,0,.6);transform:perspective(1100px) rotateX(16deg)}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:96px;z-index:3;transition:filter .3s}
.seat .av{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3b3fa0,#171c5a);border:2px solid #4a55b8;display:grid;place-items:center;font-size:1.7rem;transition:box-shadow .3s,border-color .3s}
.seat .nm{font-weight:700;font-size:.78rem;max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #000}
.seat .cnt{display:flex;align-items:center;gap:4px;font-size:.75rem;color:var(--muted)}
.seat .mini{width:14px;height:19px;border-radius:3px;background:linear-gradient(135deg,#3a2a8c,#150f3d);border:1px solid var(--or);box-shadow:3px 0 0 -1px #2a1f66,5px 0 0 -1px var(--or2)}
.seat.active .av{border-color:var(--or);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 8px 2px rgba(224,178,82,.5),0 0 26px 6px rgba(224,178,82,.2)}50%{box-shadow:0 0 18px 6px rgba(224,178,82,.9),0 0 44px 14px rgba(224,178,82,.35)}}
.seat.checking .av{border-color:var(--E);animation:chk .5s ease-in-out infinite alternate}
@keyframes chk{from{transform:translateX(-2px) rotate(-3deg)}to{transform:translateX(2px) rotate(3deg)}}
.seat.checking::after{content:"🔍";position:absolute;top:-6px;right:6px;font-size:1.2rem}
.seat.out .av{filter:grayscale(.8)}
.seat.out .nm::after{content:" ✗";color:var(--bad)}
.seat.me .nm{color:var(--or)}
.bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;background:#f6f0dd;color:#1b1630;font-size:.72rem;font-weight:600;padding:.4em .6em;border-radius:10px;width:max-content;max-width:170px;text-align:center;display:none;z-index:9;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.bubble.show{display:block;animation:pop .3s}
@keyframes pop{from{transform:translateX(-50%) scale(.7);opacity:0}}
.center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:26%;min-width:120px;text-align:center;z-index:2}
.ring{position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);animation:spin 40s linear infinite;opacity:.55;pointer-events:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.dossier{position:relative;display:inline-block;width:100%;max-width:120px}
.dossier svg{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
.dir{font-size:.68rem;color:var(--or);margin-top:2px}
#announce{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:12;background:rgba(5,6,13,.9);border:1px solid var(--or);border-radius:16px;padding:14px 20px;text-align:center;max-width:86%;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;box-shadow:0 0 50px rgba(224,178,82,.3)}
#announce.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#announce b{display:block;font-family:var(--serif);font-size:1.5rem;color:var(--or)}
#announce span{font-size:1.02rem}
.fly{position:absolute;left:0;top:0;width:34px;height:48px;border-radius:5px;background:linear-gradient(135deg,#3a2a8c,#150f3d);border:2px solid var(--or);z-index:15;pointer-events:none}
.status{background:rgba(14,21,56,.9);border:1px solid #2c3677;border-left:4px solid var(--or);border-radius:10px;padding:.65em .9em;font-size:.92rem;line-height:1.4;flex:none}
.status small{display:block;color:var(--muted);margin-bottom:2px}
#actions{display:none;background:rgba(10,14,40,.92);border:1px solid var(--or2);border-radius:14px;padding:12px;flex:none}
#actions.on{display:block;animation:rise .35s}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.act-head{margin-bottom:8px;line-height:1.45}
.selrow{margin:6px 0}
.sellabel{font-weight:800;font-size:.8rem;color:var(--c);margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);background:rgba(255,255,255,.04);border-radius:999px;padding:.4em .75em;font-size:.82rem;font-weight:600;display:inline-flex;gap:.4em;align-items:center}
.chip.on{background:var(--c);color:#12091f;border-color:#fff}
.phrase{margin:10px 0;font-family:var(--serif);font-size:1.3rem;min-height:1.6em;color:var(--or)}
.act-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.handwrap{flex:none}
.hand-title{font-weight:700;font-size:.85rem;color:var(--muted);margin:2px 0 6px}
.hand-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.handcard{background:none;border:0;padding:0;border-radius:10px;transition:transform .2s}
.handcard:hover{transform:translateY(-8px) scale(1.04)}
.handcard .card{--w:86px}
.side{width:380px;flex:none;display:flex;flex-direction:column;background:#080c26;border-left:1px solid #1f2760;min-height:0}
.tabs{display:flex;border-bottom:1px solid #1f2760;flex:none}
.tabs button{flex:1;padding:.75em;background:none;border:0;border-bottom:3px solid transparent;font-weight:700;color:var(--muted)}
.tabs button.on{color:var(--or);border-color:var(--or)}
.pane{flex:1;overflow-y:auto;padding:10px;display:none;min-height:0}
.pane.on{display:block}
.ncat{font-family:var(--serif);font-size:1.15rem;margin:12px 0 4px;color:var(--c)}
.nrow{border-left:4px solid #2c3677;background:#0c1334;border-radius:8px;padding:6px 8px;margin:5px 0}
.nrow .l1{display:flex;gap:6px;align-items:center}
.nrow .nname{flex:1;font-weight:700;font-size:.88rem}
.nrow select{width:auto;padding:.3em .4em;font-size:.76rem;max-width:150px}
.nrow .l2{display:flex;gap:6px;margin-top:5px}
.nrow .l2 select{max-width:104px}.nrow .l2 input{padding:.3em .5em;font-size:.76rem}
.st-own{border-color:var(--ok)}.st-seen{border-color:var(--E)}.st-elim{border-color:#555b86;opacity:.6}.st-suspect{border-color:var(--bad)}.st-solution{border-color:var(--or);background:#2a2208}
.grid{width:100%;border-collapse:collapse;font-size:.72rem}
.grid th,.grid td{border:1px solid #1f2760;padding:3px;text-align:center}
.grid td button{background:none;border:0;width:100%;min-height:22px}
.grid .ok{color:var(--ok)}.grid .no{color:var(--bad)}
.logturn{font-weight:800;color:var(--or);margin:12px 0 4px;font-size:.8rem}
.le{font-size:.86rem;line-height:1.4;padding:5px 8px;border-radius:8px;margin:3px 0;background:#0c1334;border-left:3px solid #2c3677}
.le.priv{border-left-color:var(--violet);background:#1a1540}
.le.priv::before{content:"🔒 Privé · ";color:#b9a6ff;font-weight:700}
.le.key{border-left-color:var(--or)}
.flt{display:flex;gap:6px;margin-bottom:8px}
@media (max-width:999px){
 .side{position:absolute;top:0;right:0;bottom:0;width:min(420px,94vw);z-index:30;transform:translateX(105%);transition:transform .3s;box-shadow:-20px 0 40px rgba(0,0,0,.6)}
 .side.open{transform:none}
}
@media (min-width:1000px){.side.closed{display:none}}
@media (max-width:700px){
 .table{aspect-ratio:1/1.02}
 .felt{inset:14% 4%}
 .seat{width:70px}.seat .av{width:40px;height:40px;font-size:1.3rem}.seat .nm{font-size:.7rem;max-width:70px}
 .handcard .card{--w:70px}
 .botrow{grid-template-columns:50px 1fr}.botrow select.lv{grid-column:1/-1}
 .topbar .ttl{font-size:1.15rem}.ib{padding:.45em .6em}
}
/* MODALS */
#modals{position:absolute;inset:0;z-index:100;pointer-events:none}
.modal{position:absolute;inset:0;background:rgba(3,4,12,.82);display:grid;place-items:center;padding:14px;pointer-events:auto;animation:fade .25s;overflow:auto}
@keyframes fade{from{opacity:0}}
.mbox{background:linear-gradient(180deg,#141b4c,#0a0f31);border:1px solid var(--or2);border-radius:18px;padding:20px;max-width:560px;width:100%;max-height:92%;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.mbox h3{font-size:1.6rem;color:var(--or);margin-bottom:8px}
.mbox p{line-height:1.5;color:#d6d3ec}
.warn{background:rgba(255,107,122,.12);border:1px solid var(--bad);border-radius:10px;padding:.7em .9em;margin:10px 0;font-size:.9rem}
.pickrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.pickrow button{background:none;border:0;padding:0;border-radius:12px;transition:transform .2s}
.pickrow button:hover{transform:translateY(-6px)}
.big .card{--w:190px}
.center-t{text-align:center}
#toasts{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
.toast{background:#f6f0dd;color:#1b1630;padding:.6em 1em;border-radius:12px;font-weight:600;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.6);animation:rise .3s;max-width:480px;text-align:center}
.toast.bad{background:var(--bad);color:#2a0008}
.hl{outline:3px solid var(--or)!important;outline-offset:4px;animation:glow 1.4s infinite;border-radius:12px}
.res{text-align:center}
.res h2{font-size:2.4rem;color:var(--or)}
.res .rc{display:flex;gap:10px;justify-content:center;margin:16px 0}
.res .rc .card{--w:96px}
.res-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:12px 0}
.res-stats div{background:#0c1334;border:1px solid #232c6a;border-radius:10px;padding:8px;font-size:.82rem;color:var(--muted)}
.res-stats b{display:block;color:var(--txt);font-size:1.1rem}
.conf{position:fixed;top:-20px;width:9px;height:14px;z-index:300;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.tests li{padding:6px 0;border-bottom:1px solid #1f2760;font-size:.88rem}
.tests .ok{color:var(--ok)}.tests .ko{color:var(--bad)}
body.noanim *{animation-duration:.01ms!important;animation-iteration-count:1!important}
body.noanim .card .inner{transition-duration:.01ms}
@media (prefers-reduced-motion:reduce){.doc,.lens,.cone,.ring{animation:none}}

/* ===== v2 : lisibilité ===== */
.chips[hidden]{display:none}

<script>
/* Salon en ligne hors Claude (GitHub Pages…) : recrée window.claude.use('room') via MQTT sur des brokers publics.
   Salon privé entre amis : ouvrez la page avec ?salon=monnom (ex. .../index.html?salon=famille). */
(function(){
 if(window.claude&&window.claude.use)return;
 const NAME=(new URLSearchParams(location.search).get('salon')||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,32);
 const BASE='dossier-secret-k7q2x9/'+(NAME||'public');
 const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'];
 const LIBS=['https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js','https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js'];
 const ID_RE=/^[a-z0-9]{6,16}$/;
 const rid=()=>{const a=new Uint8Array(10);crypto.getRandomValues(a);return Array.from(a,x=>(x%36).toString(36)).join('');};
 const ME=rid();
 const loadScript=u=>new Promise((ok,ko)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=()=>{s.remove();ko(new Error('load'));};document.head.appendChild(s);});
 async function loadMqtt(){
  if(window.mqtt)return;
  for(const u of LIBS){try{await loadScript(u);if(window.mqtt)return;}catch(e){}}
  throw new Error('mqtt');
 }
 function tryBroker(url,will){
  return new Promise((ok,ko)=>{
   const c=window.mqtt.connect(url,{clientId:'ds_'+ME,clean:true,keepalive:30,reconnectPeriod:2000,connectTimeout:6000,will});
   let done=false;
   const t=setTimeout(()=>{if(!done){done=true;try{c.end(true);}catch(e){}ko(new Error('timeout'));}},7000);
   c.on('error',()=>{});
   c.once('connect',()=>{if(!done){done=true;clearTimeout(t);ok(c);}});
  });
 }
 const clean=o=>({name:String((o&&o.name)||'Joueur').slice(0,24),avatar:String((o&&o.avatar)||'🕵️').slice(0,8),st:(o&&o.st)==='table'?'table':'dispo'});
 async function makeRoom(){
  await loadMqtt();
  const myTopic=BASE+'/p/'+ME;
  let c=null;
  for(const u of BROKERS){try{c=await tryBroker(u,{topic:myTopic,payload:'',qos:0,retain:true});break;}catch(e){}}
  if(!c)throw new Error('broker');
  let mine={};
  const peers=new Map(),peerCbs=[],evCbs={},tables=new Map();
  const pub=(t,o,retain)=>{try{c.publish(t,JSON.stringify(o),{qos:0,retain:!!retain});}catch(e){}};
  const list=()=>{const a=[{peer:ME,presence:clean(mine),isMe:true,sameTab:true,kind:'viewer'}];peers.forEach((v,k)=>a.push({peer:k,presence:v.presence,isMe:false,sameTab:false,kind:'viewer'}));return a;};
  const notify=()=>{const ch={peers:list()};peerCbs.forEach(f=>{try{f(ch);}catch(e){}});};
  const sendPresence=()=>{if(mine.name)pub(myTopic,clean(mine),true);};
  const fire=(t,m)=>(evCbs[t]||[]).forEach(f=>{try{f(m);}catch(e){}});
  c.on('message',(topic,buf,pkt)=>{
   if(topic.indexOf(BASE+'/')!==0)return;
   const parts=topic.slice(BASE.length+1).split('/'),raw=buf.toString();
   let msg=null;
   if(raw){try{msg=JSON.parse(raw);}catch(e){return;}}
   if(parts[0]==='p'){
    const id=parts[1]||'';
    if(!ID_RE.test(id)||id===ME)return;
    if(!msg){if(peers.delete(id))notify();return;}
    const old=peers.get(id);
    peers.set(id,{presence:clean(msg),last:Date.now(),live:!(pkt&&pkt.retain)||!!(old&&old.live)});
    notify();
   }else if(parts[0]==='e'){
    if(!msg||typeof msg.t!=='string'||!ID_RE.test(msg.f||''))return;
    fire(msg.t,{peer:msg.f,isMe:msg.f===ME,kind:'viewer',data:msg.d});
   }else if(parts[0]==='t'){
    const h=tables.get(parts[1]);
    if(h&&msg&&typeof msg.t==='string'&&ID_RE.test(msg.f||''))h(msg.t,{peer:msg.f,isMe:msg.f===ME,kind:'viewer',data:msg.d});
   }
  });
  c.subscribe([BASE+'/p/+',BASE+'/e/'+ME,BASE+'/e/all'],{qos:0});
  c.on('connect',sendPresence);
  setInterval(()=>{
   sendPresence();
   const now=Date.now();let ch=false;
   peers.forEach((v,k)=>{if(now-v.last>(v.live?50000:25000)){peers.delete(k);ch=true;}});
   if(ch)notify();
  },15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)sendPresence();});
  window.addEventListener('pagehide',()=>{try{c.publish(myTopic,'',{qos:0,retain:true});}catch(e){}});
  return{
   onPeers(f){peerCbs.push(f);f({peers:list()});},
   on(t,f){(evCbs[t]=evCbs[t]||[]).push(f);},
   emit(t,d){const to=d&&d.to;pub(BASE+'/e/'+(ID_RE.test(to||'')?to:'all'),{t:String(t),f:ME,d:d});},
   presence(o){mine={...mine,...o};sendPresence();notify();},
   async join(name){
    name=String(name).replace(/[^a-z0-9]/g,'').slice(0,24);
    if(!name)throw new Error('name');
    const topic=BASE+'/t/'+name,cbs={};
    tables.set(name,(t,m)=>(cbs[t]||[]).forEach(f=>{try{f(m);}catch(e){}}));
    c.subscribe(topic,{qos:0});
    return{
     on(t,f){(cbs[t]=cbs[t]||[]).push(f);},
     emit(t,d){pub(topic,{t:String(t),f:ME,d:d});},
     leave(){tables.delete(name);try{c.unsubscribe(topic);}catch(e){}}
    };
   }
  };
 }
 let roomP=null;
 window.SALON_NAME=NAME;
 window.claude={use:async k=>{
  if(k!=='room')throw new Error('unsupported');
  return roomP||(roomP=makeRoom().catch(e=>{roomP=null;throw e;}));
 }};
})();
</script>
<script>
'use strict';
/* =====================================================================
   1. DONNÉES DES CARTES
   ===================================================================== */
const CATS={P:{label:'Personnage',plural:'Personnages'},E:{label:'État',plural:'États'},A:{label:'Attribut',plural:'Attributs'}};
const CARDS=[
 {id:'P1',cat:'P',name:'M. Parme',g:'m',emb:'🎩',acc:'#7a5cf0'},
 {id:'P2',cat:'P',name:'Lt Poussin',g:'m',emb:'🎖️',acc:'#9a6bff'},
 {id:'P3',cat:'P',name:'Mme Coton',g:'f',emb:'🧶',acc:'#b25fe0'},
 {id:'P4',cat:'P',name:'Dr Azur',g:'m',emb:'🩺',acc:'#5b6df0'},
 {id:'P5',cat:'P',name:'Pr Gazon',g:'m',emb:'🌿',acc:'#6a5bd6'},
 {id:'P6',cat:'P',name:'Mlle Fraise',g:'f',emb:'🍓',acc:'#d05ac0'},
 {id:'E1',cat:'E',name:'Paraît',emb:'◇',acc:'#2fb4d6'},
 {id:'E2',cat:'E',name:'Est',emb:'✦',acc:'#2a9fd0'},
 {id:'E3',cat:'E',name:'Devient',emb:'❖',acc:'#25c0c0'},
 {id:'E4',cat:'E',name:'Semble',emb:'✧',acc:'#3a8fe0'},
 {id:'E5',cat:'E',name:'Demeure',emb:'⬡',acc:'#2fa8a0'},
 {id:'E6',cat:'E',name:'Reste',emb:'◈',acc:'#4aa3c8'},
 {id:'A1',cat:'A',m:'Inquiet',f:'Inquiète',emb:'😟',acc:'#e0b252'},
 {id:'A2',cat:'A',m:'Nerveux',f:'Nerveuse',emb:'😬',acc:'#d9a23c'},
 {id:'A3',cat:'A',m:'Affolé',f:'Affolée',emb:'😱',acc:'#e8c068'},
 {id:'A4',cat:'A',m:'Soucieux',f:'Soucieuse',emb:'😥',acc:'#c9993a'},
 {id:'A5',cat:'A',m:'Tendu',f:'Tendue',emb:'😖',acc:'#e5b84c'},
 {id:'A6',cat:'A',m:'Crispé',f:'Crispée',emb:'😣',acc:'#d4a63f'},
 {id:'A7',cat:'A',m:'Anxieux',f:'Anxieuse',emb:'😰',acc:'#ecc45f'},
 {id:'A8',cat:'A',m:'Agité',f:'Agitée',emb:'😵',acc:'#cf9d36'},
 {id:'A9',cat:'A',m:'Tracassé',f:'Tracassée',emb:'😓',acc:'#dcae48'}
];
CARDS.forEach(c=>{if(c.cat==='A')c.name=c.m+' / '+c.f;});
const BY={};CARDS.forEach(c=>BY[c.id]=c);
const IDS=CARDS.map(c=>c.id);
const CAT_IDS={P:IDS.filter(i=>BY[i].cat==='P'),E:IDS.filter(i=>BY[i].cat==='E'),A:IDS.filter(i=>BY[i].cat==='A')};
const LEVELS={facile:0,normal:1,expert:2};
const LEVEL_LABEL={facile:'Facile',normal:'Normal',expert:'Expert'};
const AVATARS=['🕵️','🦊','🦉','🐺','🎭','🗝️','🦅','🐈‍⬛','🧐','🎩','🔍','🦇'];
function sentence(t,first){
 const p=BY[t[0]],e=BY[t[1]],a=BY[t[2]];
 const s=`${p.name} ${e.name.toLowerCase()} ${(p.g==='f'?a.f:a.m).toLowerCase()}.`;
 return first?`Je pense que ${s}`:s;
}
function validTrio(t){return Array.isArray(t)&&t.length===3&&t[0] in BY&&t[1] in BY&&t[2] in BY&&BY[t[0]].cat==='P'&&BY[t[1]].cat==='E'&&BY[t[2]].cat==='A';}

/* ===== utilitaires ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const fmtTime=s=>{s=Math.round(s);return Math.floor(s/60)+' min '+String(s%60).padStart(2,'0')+' s';};

/* =====================================================================
   2. STOCKAGE LOCAL (avec repli mémoire)
   ===================================================================== */
const LS={mem:{},
 get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return k in this.mem?JSON.parse(this.mem[k]):d;}},
 set(k,v){const s=JSON.stringify(v);try{localStorage.setItem(k,s);return true;}catch(e){this.mem[k]=s;return false;}},
 del(k){try{localStorage.removeItem(k);}catch(e){}delete this.mem[k];}
};
const Settings={d:null,def:{name:'Détective',avatar:'🕵️',anim:true,sound:true,music:false,fast:false,tuto:false,step:true},
 get(){if(!this.d)this.d={...this.def,...LS.get('ds:settings',{})};return this.d;},
 set(p){Object.assign(this.get(),p);LS.set('ds:settings',this.d);document.body.classList.toggle('noanim',!this.d.anim);}
};
const Save={KEY:'ds:save:v1',
 write(G,key){G.elapsed=(G.elapsed||0)+(Date.now()-(G.resumedAt||Date.now()));G.resumedAt=Date.now();const c={...G};delete c.obs;delete c.checking;return LS.set(key||this.KEY,c);},
 read(key){return LS.get(key||this.KEY,null);},
 clear(){LS.del(this.KEY);},
 exists(){const g=this.read();return !!(g&&!g.over&&Engine.validate(g));}
};
const Stats={KEY:'ds:stats',
 get(){return {played:0,wins:0,losses:0,hyp:0,correct:0,time:0,best:null,history:[],ach:{},...LS.get(this.KEY,{})};},
 record(G){
  const s=this.get(),secs=Math.round(((G.elapsed||0)+(Date.now()-(G.resumedAt||Date.now())))/1000);
  const win=G.winner===0;
  s.played++;win?s.wins++:s.losses++;s.hyp+=G.players[0].hyp;s.time+=secs;
  if(win){s.correct++;if(s.best===null||secs<s.best)s.best=secs;}
  s.history.unshift({date:Date.now(),res:win?'win':(G.winner===null?'none':'loss'),n:G.players.length,lv:G.players.slice(1).map(p=>p.level),turns:G.turn,secs,winner:G.winner===null?null:G.players[G.winner].name});
  s.history=s.history.slice(0,15);
  const un=[],add=(id)=>{if(!s.ach[id]){s.ach[id]=Date.now();un.push(id);}};
  if(win){add('first');if(G.players.slice(1).some(p=>p.level==='expert'))add('expert');if(s.wins>=5)add('five');if(G.players.every(p=>p.wrong===0))add('clean');}
  LS.set(this.KEY,s);return {s,un,secs};
 },
 ACH:{first:['🔎','Première enquête résolue','Gagnez votre première partie.'],expert:['🧠','Victoire contre un bot Expert','Gagnez avec au moins un bot Expert à la table.'],five:['🏆','Cinq victoires','Cumulez cinq victoires.'],clean:['✨','Enquête parfaite','Gagnez dans une partie où personne n\'a fait d\'accusation incorrecte.']}
};

/* =====================================================================
   3. MOTEUR DE RÈGLES (aucune dépendance à l'interface)
   ===================================================================== */
const Engine={
 newGame(cfg){
  const n=cfg.players.length;
  if(n<2||n>6)throw new Error('Il faut entre 2 et 6 participants.');
  const secret=['P','E','A'].map(k=>rnd(shuffle(CAT_IDS[k])));
  const rest=shuffle(IDS.filter(i=>!secret.includes(i)));
  const hands=Array.from({length:n},()=>[]);
  const off=Math.floor(Math.random()*n);
  rest.forEach((id,k)=>hands[(k+off)%n].push(id));
  hands.forEach(h=>h.sort((a,b)=>IDS.indexOf(a)-IDS.indexOf(b)));
  const G={v:1,id:Date.now(),players:cfg.players.map((p,i)=>({name:p.name,avatar:p.avatar,human:!!p.human,level:p.level||null,hand:hands[i],canAccuse:true,hyp:0,wrong:0})),
   secret,active:Math.floor(Math.random()*n),turn:1,phase:'choose',log:[],over:false,winner:null,elapsed:0,resumedAt:Date.now(),mems:[],nb:null,fresh:true};
  G.mems=G.players.map((p,i)=>p.human?null:Bots.newMem(i,n,LEVELS[p.level||'normal'],hands[i],hands.map(h=>h.length)));
  if(G.players[0].human)NB.init(G);
  this.log(G,'L\'enquête commence. Trois cartes — un personnage, un état, un attribut — sont enfermées dans le dossier secret.','pub','key');
  this.log(G,`Les 18 autres cartes sont distribuées. ${G.players[G.active].name} commence. Les tours tournent dans le sens des aiguilles d'une montre.`,'pub');
  return G;
 },
 validate(G){
  try{
   if(!G||!Array.isArray(G.players)||G.players.length<2||G.players.length>6)return false;
   const all=[...G.secret];G.players.forEach(p=>all.push(...p.hand));
   if(all.length!==21||new Set(all).size!==21||!all.every(i=>i in BY))return false;
   return validTrio(G.secret);
  }catch(e){return false;}
 },
 log(G,txt,vis,kind){G.log.push({t:G.turn,txt,vis:vis||'pub',kind:kind||''});},
 checkOrder(G,i){const n=G.players.length,o=[];for(let k=1;k<n;k++)o.push((i+k)%n);return o;},
 matching(G,j,trio){return G.players[j].hand.filter(c=>trio.includes(c));},
 beginSuggestion(G,i,trio){
  if(G.over)throw new Error('La partie est terminée.');
  if(G.active!==i)throw new Error('Ce n\'est pas votre tour.');
  if(G.phase!=='choose')throw new Error('Vous avez déjà formulé une hypothèse ce tour-ci.');
  if(!validTrio(trio))throw new Error('Une hypothèse contient exactement 1 personnage, 1 état et 1 attribut.');
  const p=G.players[i];p.hyp++;
  const obs={asker:i,trio:trio.slice(),passed:[],shower:null,card:null};
  G.obs=obs;
  this.log(G,`Tour ${G.turn} — ${p.name} : « ${sentence(trio,false)} »`,'pub','key');
  return obs;
 },
 recordPass(G,obs,j){obs.passed.push(j);this.log(G,`${G.players[j].name} ne peut rien montrer.`,'pub');},
 recordShow(G,obs,j,card){
  if(obs.shower!==null)throw new Error('Une seule carte peut être montrée par hypothèse.');
  if(!G.players[j].hand.includes(card)||!obs.trio.includes(card))throw new Error('Carte illégale : elle doit être dans la main et faire partie de l\'hypothèse.');
  if(!this.checkOrder(G,obs.asker).includes(j))throw new Error('Joueur illégal.');
  const bef=this.checkOrder(G,obs.asker);
  for(const k of bef){if(k===j)break;if(!obs.passed.includes(k))throw new Error('La vérification doit suivre l\'ordre des aiguilles d\'une montre.');}
  obs.shower=j;obs.card=card;
  const A=G.players[obs.asker],S=G.players[j];
  this.log(G,`${S.name} montre secrètement une carte à ${A.name}.`,'pub');
  if(A.human&&!A.remote)this.log(G,`${S.name} vous montre : « ${BY[card].name} ».`,'priv');
  if(S.human&&!S.remote)this.log(G,`Vous montrez « ${BY[card].name} » à ${A.name}.`,'priv');
 },
 endSuggestion(G,obs){
  if(obs.shower===null)this.log(G,'Personne ne peut répondre : aucun autre joueur ne possède ces cartes.','pub');
  G.players.forEach((p,i)=>{if(!G.mems[i])return;
   Bots.observe(G.mems[i],{asker:obs.asker,trio:obs.trio,passed:obs.passed.slice(),shower:obs.shower,card:i===obs.asker?obs.card:null});});
  if(G.players[0].human&&obs.asker===0&&obs.shower!==null)NB.markSeen(G,obs.card,obs.shower);
  G.phase='after';G.obs=null;
 },
 canAccuse(G,i){return !G.over&&G.active===i&&G.players[i].canAccuse&&(G.phase==='choose'||G.phase==='after');},
 accuse(G,i,trio){
  if(!this.canAccuse(G,i))throw new Error('Accusation impossible maintenant.');
  if(!validTrio(trio))throw new Error('Une accusation contient 1 personnage, 1 état et 1 attribut.');
  const p=G.players[i],ok=trio.every((c,k)=>c===G.secret[k]);
  this.log(G,`${p.name} accuse : « ${sentence(trio,false)} »`,'pub','key');
  if(ok){G.over=true;G.winner=i;G.phase='over';this.log(G,`${p.name} a trouvé le dossier secret !`,'pub','key');return {correct:true};}
  p.canAccuse=false;p.wrong++;
  this.log(G,`Accusation fausse ! ${p.name} ne pourra plus accuser, mais continue de vérifier les hypothèses.`,'pub','key');
  G.mems.forEach(m=>{if(m)Bots.observeWrong(m,trio);});
  if(!G.players.some(q=>q.canAccuse)){G.over=true;G.winner=null;G.phase='over';this.log(G,'Plus personne ne peut accuser : affaire classée sans vainqueur.','pub','key');}
  else G.phase='end';
  return {correct:false};
 },
 endTurn(G){G.active=(G.active+1)%G.players.length;G.turn++;G.phase='choose';}
};

 init(G){

 },
 fill(G,c,owner){const nb=G.nb;const cols=[...G.players.keys(),'S'];cols.forEach(k=>{nb.grid[c+'|'+k]=(k===owner?'y':'n');});},

/* =====================================================================
   4. MOTEUR DE DÉDUCTION DES BOTS
      Un bot ne reçoit JAMAIS G : uniquement sa mémoire personnelle.
   ===================================================================== */
const Bots={
 newMem(i,n,level,hand,sizes){
  const known={};hand.forEach(c=>known[c]=i);
  return {me:i,n,level,own:hand.slice(),handSizes:sizes.slice(),known,notHas:{},cons:[],wrong:[],asked:[],shownTo:{},seen:[],played:0};
 },
 observe(m,o){
  m.seen.push({asker:o.asker,trio:o.trio.slice(),passed:o.passed.slice(),shower:o.shower});
  if(o.asker===m.me){m.asked.push(o.trio.slice());if(o.shower!==null&&o.card)m.known[o.card]=o.shower;}
  o.passed.forEach(p=>{if(p===m.me)return;const a=m.notHas[p]||(m.notHas[p]=[]);o.trio.forEach(c=>{if(!a.includes(c))a.push(c);});});
  if(o.shower!==null&&o.shower!==m.me&&o.asker!==m.me)m.cons.push({pid:o.shower,cards:o.trio.slice()});
 },
 observeWrong(m,t){m.wrong.push(t.slice());},
 /* Niveaux : 0 = cartes vues seulement ; 1 = + refus/contraintes ; 2 = + tailles de mains + faisabilité globale */
 analyze(m){
  const L=m.level,n=m.n,me=m.me,others=[];
  for(let i=0;i<n;i++)if(i!==me)others.push(i);
  const cand={};
  for(const c of IDS){
   if(m.known[c]!==undefined){cand[c]=new Set([m.known[c]]);continue;}
   const s=new Set(others);s.add('S');
   if(L>=1)others.forEach(p=>{if((m.notHas[p]||[]).includes(c))s.delete(p);});
   cand[c]=s;
  }
  const fixedS=c=>cand[c].size===1&&cand[c].has('S');
  let ch=true,g=0;
  while(L>=1&&ch&&g++<60){
   ch=false;
   for(const k of m.cons){
    const cs=k.cards.filter(c=>cand[c].has(k.pid));
    if(cs.length===1&&cand[cs[0]].size>1){cand[cs[0]]=new Set([k.pid]);ch=true;}
   }
   for(const cat of ['P','E','A']){
    const ids=CAT_IDS[cat],sc=ids.filter(c=>cand[c].has('S'));
    if(sc.length===1&&cand[sc[0]].size>1){cand[sc[0]]=new Set(['S']);ch=true;}
    const fs=ids.find(fixedS);
    if(fs)for(const c of ids)if(c!==fs&&cand[c].has('S')){cand[c].delete('S');ch=true;}
   }
   for(const w of m.wrong){
    const fx=w.filter(fixedS),op=w.filter(c=>!fixedS(c));
    if(fx.length===2&&op.length===1&&cand[op[0]].has('S')&&cand[op[0]].size>1){cand[op[0]].delete('S');ch=true;}
   }
   if(L>=2)for(const p of others){
    const hs=m.handSizes[p],fp=IDS.filter(c=>cand[c].size===1&&cand[c].has(p));
    if(fp.length>=hs){for(const c of IDS)if(cand[c].size>1&&cand[c].has(p)){cand[c].delete(p);ch=true;}}
    else{const poss=IDS.filter(c=>cand[c].has(p));if(poss.length===hs)for(const c of poss)if(cand[c].size>1){cand[c]=new Set([p]);ch=true;}}
   }
  }
  return cand;
 },
 feasible(m,cand,tri){
  const me=m.me,n=m.n,own=new Set(m.own),cap={};
  for(let i=0;i<n;i++)if(i!==me)cap[i]=m.handSizes[i];
  const asg={},free=[];
  for(const c of IDS){
   if(tri.includes(c)){if(!cand[c].has('S'))return false;continue;}
   if(own.has(c))continue;
   const cs=[...cand[c]].filter(x=>x!=='S');
   if(!cs.length)return false;
   if(cs.length===1&&cand[c].size===1){asg[c]=cs[0];if(--cap[cs[0]]<0)return false;}
   else free.push({c,cs});
  }
  free.sort((a,b)=>a.cs.length-b.cs.length);
  const fm={};free.forEach(f=>fm[f.c]=f.cs);
  const canHold=(c,p)=>{if(tri.includes(c))return false;if(own.has(c))return p===me;if(asg[c]!==undefined)return asg[c]===p;return !!fm[c]&&fm[c].includes(p)&&cap[p]>0;};
  const consOK=()=>m.cons.every(k=>k.cards.some(c=>canHold(c,k.pid)));
  if(!consOK())return false;
  let nodes=0;
  const rec=k=>{
   if(++nodes>1200||k===free.length)return true;
   const {c,cs}=free[k];
   for(const p of cs){if(cap[p]<=0)continue;cap[p]--;asg[c]=p;if(consOK()&&rec(k+1))return true;cap[p]++;delete asg[c];}
   return false;
  };
  return rec(0);
 },
 state(m){
  const cand=this.analyze(m),sets={};
  for(const k of ['P','E','A'])sets[k]=CAT_IDS[k].filter(c=>cand[c].has('S'));
  const wk=m.level>=1?m.wrong.map(w=>w.slice().sort().join('|')):[];
  let tr=[];
  for(const p of sets.P)for(const e of sets.E)for(const a of sets.A){
   const t=[p,e,a];if(wk.includes(t.slice().sort().join('|')))continue;tr.push(t);
  }
  if(m.level>=2&&tr.length>1){const f=tr.filter(t=>this.feasible(m,cand,t));if(f.length)tr=f;}
  if(m.level>=2){for(const [k,x] of [['P',0],['E',1],['A',2]]){const u=[...new Set(tr.map(t=>t[x]))];if(u.length)sets[k]=u;}}
  const freq={};tr.forEach(t=>t.forEach(c=>freq[c]=(freq[c]||0)+1/tr.length));
  return {cand,sets,triples:tr,freq};
 },
 afterAccuse(m,can){
  if(!can)return null;const st=this.state(m);
  return st.triples.length===1?st.triples[0]:null;
 },
 decide(m,can){
  const st=this.state(m);
  if(can){
   if(st.triples.length===1)return {type:'accuse',trio:st.triples[0]};
   const th=[16,11,8][m.level];
   if(st.triples.length>0&&st.triples.length<=2&&m.played>=th)return {type:'accuse',trio:rnd(st.triples)};
  }
  m.played++;
  return {type:'suggest',trio:this.pick(m,st)};
 },
 asked(m,c){return m.asked.filter(t=>t.includes(c)).length;},
 pick(m,st){
  const L=m.level,own=new Set(m.own);
  const build=jit=>['P','E','A'].map(k=>{
   let cs=st.sets[k].length?st.sets[k]:CAT_IDS[k];
   if(L===0){if(Math.random()<.35)cs=CAT_IDS[k];return rnd(cs);}
   if(cs.length===1){const mine=CAT_IDS[k].filter(c=>own.has(c));if(mine.length&&(L===2||Math.random()<.5))return rnd(mine);return cs[0];}
   let best=null,bs=-1e9;
   for(const c of cs){const s=(L===2?(st.freq[c]||0)*2:0)-this.asked(m,c)*(L===2?.8:1)+Math.random()*jit;if(s>bs){bs=s;best=c;}}
   return best;
  });
  let t=build(L===2?.25:.9);
  if(L>=1)for(let a=0;a<8&&m.asked.some(x=>x.join()===t.join());a++)t=build(1.5+a);
  return t;
 },
 chooseShow(m,asker,matches){
  let c;
  if(matches.length===1)c=matches[0];
  else{
   const sh=m.shownTo[asker]||[];
   const prev=matches.filter(x=>sh.includes(x));
   c=(m.level>=1&&prev.length)?rnd(prev):rnd(matches);
  }
  (m.shownTo[asker]||(m.shownTo[asker]=[])).push(c);
  return c;
 }
};

   5. SONS (WebAudio, 100 % local)
   ===================================================================== */
const Snd={ctx:null,mus:null,
 unlock(){
  if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}}
  if(this.ctx.state==='suspended')this.ctx.resume();
  if(Settings.get().music&&!this.mus)this.startMusic();
 },
 tone(f,t,d,type='sine',v=.12){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05);},
 noise(t,d,v=.15){const c=this.ctx,b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();f.type='bandpass';f.frequency.value=2400;g.gain.value=v;s.buffer=b;s.connect(f).connect(g).connect(c.destination);s.start(t);},
 play(n){
  if(!Settings.get().sound||!this.ctx)return;const t=this.ctx.currentTime;
  switch(n){
   case 'flip':this.noise(t,.18,.2);break;
   case 'deal':this.noise(t,.08,.12);break;
   case 'ok':this.tone(660,t,.15,'triangle');this.tone(990,t+.1,.2,'triangle');break;
   case 'err':this.tone(220,t,.3,'sawtooth',.1);this.tone(165,t+.15,.4,'sawtooth',.1);break;
   case 'turn':this.tone(520,t,.18,'sine',.09);break;
   case 'alert':this.tone(330,t,.25,'square',.06);this.tone(440,t+.25,.35,'square',.06);break;
   case 'win':[523,659,784,1047].forEach((f,i)=>this.tone(f,t+i*.14,.5,'triangle',.14));break;
   case 'lose':[392,330,262].forEach((f,i)=>this.tone(f,t+i*.25,.6,'sine',.12));break;
  }
 },
 startMusic(){
  if(!this.ctx||this.mus)return;const c=this.ctx,g=c.createGain(),f=c.createBiquadFilter();
  g.gain.value=.0001;g.gain.linearRampToValueAtTime(.05,c.currentTime+3);f.type='lowpass';f.frequency.value=520;
  const chords=[[110,164.8,220,261.6],[87.3,130.8,174.6,220],[98,147,196,246.9],[82.4,123.5,164.8,207.7]];
  const oscs=[0,1,2,3].map(i=>{const o=c.createOscillator();o.type=i%2?'triangle':'sawtooth';o.frequency.value=chords[0][i];o.connect(f);o.start();return o;});
  f.connect(g).connect(c.destination);let k=0;
  const iv=setInterval(()=>{k=(k+1)%chords.length;oscs.forEach((o,i)=>o.frequency.linearRampToValueAtTime(chords[k][i],c.currentTime+3));},8000);
  this.mus={g,oscs,iv};
 },
 stopMusic(){if(!this.mus)return;const m=this.mus;this.mus=null;clearInterval(m.iv);m.g.gain.linearRampToValueAtTime(.0001,this.ctx.currentTime+.6);setTimeout(()=>m.oscs.forEach(o=>{try{o.stop();}catch(e){}}),800);}
};

/* ----- Boucle de jeu ----- */
async function gameLoop(tok){
 try{
  if(G.players[0].human&&!G.online&&!Settings.get().tuto){renderAll();await tutorial(tok);}
  while(G&&!G.over&&tok===RUN){
   renderAll();renderLog();
   const i=G.active,p=G.players[i];
   if(G.phase==='choose'){
    if(!G.online)Save.write(G);
    Snd.play('turn');setStatus(`C'est au tour de ${p.name}.`,`Tour ${G.turn}`,p.human&&!p.remote?'Vous allez pouvoir formuler une hypothèse.':'Il va réfléchir puis annoncer une hypothèse. Vous n\'avez rien à faire pour l\'instant : on vous préviendra si vous devez vérifier vos cartes.');
    await delay(T(1500),tok);
    if(p.remote){const a=await Net.expect('mv',tok);if(a.t==='suggest')await doSuggestion(i,a.trio,tok);else await doAccusation(i,a.trio,tok);}
    else if(p.human){const a=await waitHuman('choose');Net.send({k:'mv',t:a.type,trio:a.trio});if(a.type==='suggest')await doSuggestion(i,a.trio,tok);else await doAccusation(i,a.trio,tok);}
    else await botTurn(i,tok);
   }else if(G.phase==='after'){
    if(!G.online)Save.write(G);
    if(p.remote){const a=await Net.expect('mv',tok);if(a.t==='accuse')await doAccusation(i,a.trio,tok);else G.phase='end';}
    else if(p.human){const a=await waitHuman('after');Net.send({k:'mv',t:a.type==='accuse'?'accuse':'end',trio:a.trio});if(a.type==='accuse')await doAccusation(i,a.trio,tok);else{G.phase='end';}}
    else{
     const t=Bots.afterAccuse(G.mems[i],p.canAccuse);
     if(t)await doAccusation(i,t,tok);else G.phase='end';
    }
   }else if(G.phase==='end'){Engine.endTurn(G);}
   else break;
  }
  if(G&&G.over&&tok===RUN)await finishGame(tok);
 }catch(e){if(!(e instanceof Cancel)){console.error(e);toast('Erreur : '+e.message,true);if(G&&!G.over&&tok===RUN){UI.human=null;try{G.phase=G.phase==='after'?'end':'choose';gameLoop(tok);}catch(_){}}}}
}
async function botTurn(i,tok){
 const p=G.players[i];
 UI.think=i;setStatus(`${p.name} réfléchit…`,'Tour de bot');await delay(T(1400),tok);
 const d=Bots.decide(G.mems[i],p.canAccuse);
 if(d.type==='accuse')await doAccusation(i,d.trio,tok);else await doSuggestion(i,d.trio,tok);
 UI.think=null;
}
async function doSuggestion(i,trio,tok){
 const p=G.players[i],obs=Engine.beginSuggestion(G,i,trio),order=Engine.checkOrder(G,i);
 renderLog();
 UI.badge={};UI.badge[i]={t:'Hypothèse',k:'ask'};renderTable();
 say(i,sentence(trio,i===0),3000);
 banner(i===0?'Votre hypothèse':`${p.name} formule une hypothèse`,`« ${sentence(trio,i===0)} »`);
 setStatus(`${i===0?'Vous annoncez':p.name+' annonce'} : « ${sentence(trio,i===0)} »`,'Hypothèse',`Ensuite, les autres joueurs vérifient leurs cartes un par un, dans le sens des aiguilles d'une montre, en commençant par ${who(order[0])}. Le premier qui possède une de ces trois cartes en montre une seule à ${i===0?'vous':p.name}.`);
 Snd.play('turn');await stepWait(tok,2800);
 for(let k=0;k<order.length;k++){
  const j=order[k];
  G.checking=j;UI.badge[j]={t:'Vérifie…',k:'chk'};renderTable();
  setStatus(`${who(j)} regarde ses cartes…`,'Vérification',`Il cherche une de ces cartes : ${trio.map(c=>BY[c].name).join(', ')}.`);
  await delay(T(1400),tok);
  const m=Engine.matching(G,j,trio);
  if(!m.length){
   if(G.players[j].remote)await Net.expect('pass',tok);else if(G.players[j].human){await humanNothing(i,trio);Net.send({k:'pass'});}

/* ----- Salon en ligne (room : présence + demandes de partie) ----- */
const Lobby={room:null,table:null,peers:[],pend:{},inbox:[],partner:null,started:false,ready:false,
 myPeer(){const p=this.peers.find(x=>x.sameTab);return p?p.peer:null;},
 info(){const s=Settings.get();return{name:String(s.name||'Détective').slice(0,24),avatar:String(s.avatar||'🕵️').slice(0,8)};},
 pname(p){return String((p.presence&&p.presence.name)||'Joueur').slice(0,24);},
 nameOf(peer){const p=this.peers.find(x=>x.peer===peer);return p?this.pname(p):'Un joueur';},
 async init(){
  if(!this.started){
   this.started=true;this.render();
   try{this.room=window.claude&&window.claude.use?await window.claude.use('room'):null;}catch(e){this.room=null;}
   this.ready=true;
   const R=this.room;
   if(R){R.onPeers(ch=>{this.peers=ch.peers;this.prune();this.render();});R.on('invite',m=>this.onInvite(m));R.on('reply',m=>this.onReply(m));}
  }
  if(this.room)this.room.presence({...this.info(),st:this.partner?'table':'dispo'});
  this.render();
 },
 prune(){
  const here=new Set(this.peers.map(p=>p.peer)),now=Date.now();
  for(const k in this.pend)if(!here.has(k)||now-this.pend[k].ts>60000)delete this.pend[k];
  this.inbox=this.inbox.filter(i=>here.has(i.from)&&now-i.ts<120000);
  if(this.partner&&!here.has(this.partner.peer)){toast(this.partner.name+' a quitté la table.',true);this.leave(true);}
 },
 onInvite(m){
  if(m.isMe||m.kind!=='viewer')return;
  const d=m.data||{};
  if(d.to!==this.myPeer()||typeof d.id!=='string'||!/^[a-z0-9]{6,12}$/.test(d.id))return;
  if(this.partner){this.room.emit('reply',{to:m.peer,id:d.id,ok:false});return;}
  if(this.inbox.some(i=>i.id===d.id))return;
  this.inbox.push({id:d.id,from:m.peer,ts:Date.now()});
  toast('Demande de partie reçue de '+this.nameOf(m.peer));this.render();
 },
 onReply(m){
  if(m.isMe)return;
  const d=m.data||{};
  if(d.to!==this.myPeer())return;
  if(d.cancel){this.inbox=this.inbox.filter(i=>i.id!==d.id);this.render();return;}
  const p=this.pend[m.peer];
  if(!p||p.id!==d.id)return;
  delete this.pend[m.peer];
  if(d.ok)this.openTable(d.id,m.peer);else{toast(this.nameOf(m.peer)+' n\'est pas disponible pour le moment.',true);this.render();}
 },
 ask(peer){
  if(!this.room||this.pend[peer])return;
  const id=Math.random().toString(36).slice(2,10).replace(/[^a-z0-9]/g,'x').padEnd(8,'x');
  this.pend[peer]={id,ts:Date.now()};
  this.room.emit('invite',{to:peer,id});this.render();
  setTimeout(()=>{this.prune();this.render();},60500);
 },
 cancel(peer){const p=this.pend[peer];if(!p)return;delete this.pend[peer];this.room.emit('reply',{to:peer,id:p.id,ok:false,cancel:true});this.render();},
 accept(id){const i=this.inbox.find(x=>x.id===id);if(!i)return;this.room.emit('reply',{to:i.from,id,ok:true});this.openTable(id,i.from);},
 decline(id){const i=this.inbox.find(x=>x.id===id);if(!i)return;this.room.emit('reply',{to:i.from,id,ok:false});this.inbox=this.inbox.filter(x=>x.id!==id);this.render();},
 async openTable(id,peer){
  this.partner={id,peer,name:this.nameOf(peer)};this.pend={};this.inbox=[];
  try{this.table=await this.room.join('ds'+id);}catch(e){this.table=null;}
  if(this.table)Net.attach();
  this.room.presence({st:'table'});this.render();
 },
 leave(silent){
  Net.onLeave();
  try{this.table&&this.table.leave();}catch(e){}
  this.table=null;this.partner=null;
  if(this.room)this.room.presence({st:'dispo'});
  this.render();
 },
 render(){
  const el=$('#lobby');if(!el)return;
  const head='<div class="panel"><div class="back"><button class="btn small" data-act="menu">← Menu</button></div><h2>Salon en ligne</h2>'+(window.SALON_NAME?'<p class="hint">Salon privé : '+esc(window.SALON_NAME)+'</p>':'');
  let body='';
  if(!this.ready)body='<p class="hint">Connexion au salon…</p>';
  else if(!this.room)body='<p>Impossible de joindre le serveur du salon. Vérifiez votre connexion puis réessayez.</p><button class="btn gold" data-act="lobbyRetry">Réessayer</button>';
  else if(this.partner){
   body=`<div class="lob-row inv"><span class="av">✅</span><span class="nm">Table privée avec ${esc(this.partner.name)}<small>Vous êtes tous les deux connectés à la même table.</small></span><span class="acts"><button class="btn small gold" data-act="onlineStart">Jouer</button><button class="btn small ghost" data-act="lobbyLeave">Quitter la table</button></span></div>`;
  }else{
   const inv=this.inbox.map(i=>{const p=this.peers.find(x=>x.peer===i.from);return `<div class="lob-row inv"><span class="av">${esc(String((p&&p.presence.avatar)||'🕵️').slice(0,8))}</span><span class="nm">${esc(this.nameOf(i.from))}<small>vous invite à jouer</small></span><span class="acts"><button class="btn small gold" data-act="lobbyAccept" data-id="${esc(i.id)}">Accepter</button><button class="btn small ghost" data-act="lobbyDecline" data-id="${esc(i.id)}">Refuser</button></span></div>`;}).join('');
   const others=this.peers.filter(p=>!p.isMe&&p.kind==='viewer');
   const rows=others.map(p=>{
    const free=(p.presence.st||'dispo')==='dispo',pe=this.pend[p.peer];
    const act=pe?`<button class="btn small ghost" data-act="lobbyCancel" data-peer="${esc(p.peer)}">Annuler</button>`:`<button class="btn small gold" data-act="lobbyAsk" data-peer="${esc(p.peer)}" ${free?'':'disabled'}>Inviter</button>`;
    return `<div class="lob-row"><span class="av">${esc(String(p.presence.avatar||'🕵️').slice(0,8))}</span><span class="nm">${esc(this.pname(p))}<small><i class="dot ${free?'':'busy'}"></i>${pe?'Demande envoyée…':free?'Disponible':'En partie'}</small></span><span class="acts">${act}</span></div>`;}).join('');
   body=inv+'<h3>Joueurs connectés</h3>'+(rows||'<p class="hint">Personne d\'autre n\'est connecté pour l\'instant. Partagez le lien de la page : les joueurs apparaîtront ici dès qu\'ils l\'ouvrent.</p>');
  }
  el.innerHTML=head+body+'</div>';
 }
};

/* ----- Partie en ligne à deux (table du salon) : chaque appareil garde une copie de la partie, seuls les choix transitent ----- */
const Net={q:[],w:null,gid:null,pending:null,acked:true,
 attach(){const T=Lobby.table;if(!T||!T.on)return;T.on('init',m=>this.onInit(m));T.on('ack',m=>this.onAck(m));T.on('mv',m=>this.onMv(m));T.on('bye',m=>this.onBye(m));},
 emit(t,d){try{if(Lobby.table&&Lobby.table.emit)Lobby.table.emit(t,d);}catch(e){}},
 send(d){if(G&&G.online)this.emit('mv',{gid:G.id,...d});},
 ok(d){try{return !!d&&Number.isFinite(d.gid)&&(d.first===0||d.first===1)&&d.names.length===2&&d.avatars.length===2&&d.hands.length===2&&d.hands.every(Array.isArray)&&Array.isArray(d.secret);}catch(e){return false;}},
 start(){
  const P=Lobby.partner;
  if(!P||!Lobby.table||!Lobby.table.emit){toast('Rejoignez d\'abord une table depuis le salon en ligne.',true);return;}
  const pr=Lobby.peers.find(x=>x.peer===P.peer),me=Lobby.info();
  const g=Engine.newGame({players:[{name:'A',avatar:'A',human:true},{name:'B',avatar:'B',human:true}]});
  const d={gid:g.id,first:g.active,names:[me.name,P.name],avatars:[me.avatar,String((pr&&pr.presence&&pr.presence.avatar)||'🕵️')],hands:g.players.map(p=>p.hand),secret:g.secret};
  this.begin(d,true);this.pending=d;this.acked=false;
  let n=0;this.emit('init',d);
  const iv=setInterval(()=>{if(this.pending!==d||this.acked){clearInterval(iv);return;}if(++n>6){clearInterval(iv);this.fail('Votre adversaire ne répond pas.');return;}this.emit('init',d);},2500);
 },
 begin(d,host){
  const me=host?0:1,op=1-me,nm=s=>String(s).replace(/[<>&"'`]/g,'').slice(0,14)||'Joueur',av=s=>AVATARS.includes(s)?s:'🕵️';
  const g=Engine.newGame({players:[{name:nm(d.names[me]),avatar:av(d.avatars[me]),human:true},{name:nm(d.names[op]),avatar:av(d.avatars[op]),human:true}]});
  g.players[0].hand=d.hands[me].slice();g.players[1].hand=d.hands[op].slice();
  g.secret=d.secret.slice();g.active=d.first===me?0:1;g.id=d.gid;g.online=true;g.players[1].remote=true;g.log=[];
  Engine.log(g,'L\'enquête commence. Trois cartes — un personnage, un état, un attribut — sont enfermées dans le dossier secret.','pub','key');
  Engine.log(g,`Les 18 autres cartes sont distribuées. ${g.players[g.active].name} commence. Les tours tournent dans le sens des aiguilles d'une montre.`,'pub');
  NB.init(g);
  if(!Engine.validate(g))throw new Error('Partie invalide');
  this.stop();this.gid=d.gid;this.pending=null;this.acked=true;
  G=g;startRun();
 },
 onInit(m){
  if(m.isMe||!this.ok(m.data))return;
  const d=m.data,P=Lobby.partner;
  if(!P||P.peer!==m.peer)return;
  if(this.gid===d.gid){this.emit('ack',{gid:d.gid});return;}
  if(this.pending&&!this.acked&&m.peer>Lobby.myPeer())return;
  try{this.begin(d,false);}catch(e){console.error(e);return;}
  this.emit('ack',{gid:d.gid});toast(P.name+' a lancé la partie.');
 },
 onAck(m){if(m.isMe||!this.pending||!m.data||m.data.gid!==this.pending.gid)return;this.acked=true;this.pending=null;},
 onMv(m){if(m.isMe||!G||!G.online||!m.data||m.data.gid!==G.id)return;this.q.push(m.data);this.pump();},
 pump(){if(this.w&&this.q.length){const w=this.w;this.w=null;w.res(this.q.shift());}},
 expect(k,tok){
  if(tok!==RUN)return Promise.reject(new Cancel());
  return new Promise((res,rej)=>{this.w={res:d=>d.k===k?res(d):rej(new Error('Désynchronisation de la partie.')),rej};this.pump();});
 },
 stop(){this.q=[];this.pending=null;if(this.w){const w=this.w;this.w=null;w.rej(new Cancel());}},
 fail(msg){this.stop();toast(msg,true);if(G)G.online=false;ACTIONS.menu();},
 onBye(m){if(m.isMe||!G||!G.online||G.over)return;this.stop();toast('Votre adversaire a quitté la partie.',true);ACTIONS.menu();},
 onLeave(){if(G&&G.online&&!G.over){this.emit('bye',{gid:G.id});this.stop();G.online=false;G.over=true;ACTIONS.menu();}}
};

 goRulesFromGame(){closeModals();modal(`<h3>Règles en bref</h3><p>1 hypothèse = 1 personnage + 1 état + 1 attribut. Vérification dans le sens horaire, une seule carte montrée, à l'auteur seulement. Accusation exacte = victoire ; fausse = plus d'accusation.</p><button class="btn" data-act="closeModal">Fermer</button>`);},
 resume(){const s=Save.read();if(!s||!Engine.validate(s)){toast('Aucune partie valide à reprendre.',true);Save.clear();show('menu');return;}G=s;G.fresh=false;startRun();},
 setN(el){Cfg.get().n=+el.dataset.n;Cfg.save();renderSetup();},

 opt(el){const k=el.dataset.opt,v=!Settings.get()[k];Settings.set({[k]:v});if(k==='music'){Snd.unlock();v?Snd.startMusic():Snd.stopMusic();}if(k==='sound'&&v)Snd.unlock();el.classList.toggle('on',v);el.setAttribute('aria-checked',v);updateSndBtn();},
 startGame(){newGameFromCfg();},
 async restart(){closeModals();if(G&&G.online){if(G.over)Net.start();else toast('Impossible de recommencer une partie en ligne.',true);return;}if(await confirmBox('Recommencer ?','La partie en cours sera perdue et de nouvelles cartes seront distribuées.','Recommencer')){newGameFromCfgFromG();}},
 restart2(){closeModals();if(G&&G.online){Net.start();return;}newGameFromCfgFromG();},
 async quit(){if(G&&G.online&&!G.over){if(await confirmBox('Abandonner la partie ?','Votre adversaire sera prévenu et la partie en ligne se terminera.','Abandonner')){Net.emit('bye',{gid:G.id});Net.stop();G.online=false;G.over=true;ACTIONS.menu();}return;}if(G&&!G.over){if(await confirmBox('Retourner au menu ?','Votre partie est sauvegardée : vous pourrez la reprendre depuis « Reprendre la partie ».','Aller au menu')){if(G.phase!=='over')Save.write(G);ACTIONS.menu();}}else ACTIONS.menu();},
 help(){showHelp();},
 toggleSound(){Settings.set({sound:!Settings.get().sound});Snd.unlock();updateSndBtn();},
 openSide(el){const t=el.dataset.tab,s=$('#side'),vis=innerWidth>=1000?!s.classList.contains('closed'):s.classList.contains('open'),cur=$('#paneNb').classList.contains('on')?'nb':'log';if(vis&&cur===t){closeSide();return;}openSide(t);},
 closeSide(){closeSide();},
 tab(el){setTab(el.dataset.tab);},
 pick(el){const pfx=el.dataset.pfx,k=BY[el.dataset.c].cat;UI[pfx][k]=UI[pfx][k]===el.dataset.c?null:el.dataset.c;updatePhrase(pfx);Snd.play('flip');if(UI[pfx][k]){const nx=['P','E','A'].find(x=>!UI[pfx][x]);if(nx)showTab(pfx,nx);}},
 slot(el){showTab(el.dataset.pfx,el.dataset.k);},
 stepNext(){UI.stepRes&&UI.stepRes();},
 nothingOk(){UI.nothingRes&&UI.nothingRes();},
 confirmHyp(){const t=[UI.sel.P,UI.sel.E,UI.sel.A];if(!validTrio(t)){toast('Choisissez un personnage, un état et un attribut.',true);return;}Snd.play('ok');resolveHuman({type:'suggest',trio:t});},
 openAccuse(){
  if(!UI.human||!G.players[0].canAccuse){toast('Accusation impossible pour le moment.',true);return;}
  UI.acc={P:null,E:null,A:null};
  modal(`<h3>Accusation finale</h3><div class="warn"><b>Attention, c'est définitif.</b> Si une seule carte est fausse, vous perdez le droit d'accuser pour le reste de la partie (vous continuerez à répondre aux hypothèses).</div>${selectorsHTML('acc')}<div class="phrase" id="accPhrase">Sélectionnez les trois cartes.</div><div class="act-btns"><button class="btn gold" id="btnAcc" data-act="doAccuse" disabled>Accuser définitivement</button><button class="btn ghost" data-act="closeModal">Annuler</button></div>`);
 },
 doAccuse(){const t=[UI.acc.P,UI.acc.E,UI.acc.A];if(!validTrio(t)||!UI.human){return;}Snd.play('alert');resolveHuman({type:'accuse',trio:t});},
 endTurn(){if(UI.human&&UI.human.mode==='after')resolveHuman({type:'end'});},
 zoom(el){zoomCard(el.dataset.c);},
 closeModal(){const m=$('#modals').lastElementChild;if(m)m.remove();},
 showPick(el){if(UI.pickRes){Snd.play('ok');UI.pickRes(el.dataset.c);}},
 tutoNext(){UI.tuto&&UI.tuto('next');},tutoSkip(){UI.tuto&&UI.tuto('skip');},
 cfmOk(){UI.cfm&&UI.cfm(true);},cfmNo(){UI.cfm&&UI.cfm(false);},
 tutoReset(){Settings.set({tuto:false});toast('Le tutoriel sera rejoué à la prochaine partie.');},
 resetData(){if(confirm('Effacer statistiques, sauvegarde et paramètres ?')){['ds:settings','ds:stats','ds:cfg',Save.KEY].forEach(k=>LS.del(k));Settings.d=null;Cfg.d=null;Settings.set({});toast('Données effacées.');renderSettings();}},
 toggleGrid(){UI.grid=!UI.grid;renderNotebook();},
 cell(el){const k=el.dataset.k,nb=G.nb,v=nb.grid[k]||'';nb.grid[k]=v===''?'y':v==='y'?'n':'';renderNotebook();},
 logf(el){UI.logFilter=el.dataset.f;renderLog();},
 async runTests(){const out=$('#testOut');out.innerHTML='<p>Tests en cours…</p>';await Tests.run(rows=>{out.innerHTML=`<p><b>${rows.filter(r=>r.ok).length}/${rows.length} réussis</b></p><ul style="list-style:none;padding:0">${rows.map(r=>`<li class="${r.ok?'ok':'ko'}">${r.ok?'✔':'✘'} ${esc(r.name)}<br><span class="hint">${esc(r.detail)}</span></li>`).join('')}</ul>`;});}
};

 const c=G.players.map(p=>({name:p.name,avatar:p.avatar,human:p.human,level:p.level}));
 G=Engine.newGame({players:c});startRun();
}

addEventListener('resize',()=>{if(G&&UI.sideOpen&&innerWidth>=1000)$('#side').classList.remove('closed');});

/* =====================================================================
   8. TESTS AUTOMATIQUES
   ===================================================================== */
const Tests={
 mk(n,level){return {players:Array.from({length:n},(_,i)=>({name:'J'+i,avatar:'🕵️',human:false,level:level||'normal'}))};},
 truth(G,c){const k=G.players.findIndex(p=>p.hand.includes(c));return k>=0?k:'S';},
 simSuggest(G,i,trio,st){
  const obs=Engine.beginSuggestion(G,i,trio);const order=Engine.checkOrder(G,i);let shows=0;
  for(const j of order){
   const m=Engine.matching(G,j,trio);
   if(!m.length){Engine.recordPass(G,obs,j);continue;}
   const card=Bots.chooseShow(G.mems[j],i,m);Engine.recordShow(G,obs,j,card);shows++;break;
  }
  const sh=obs.shower;
  if(shows>1)st.bad.push('plusieurs cartes');
  if(sh!==null){const idx=order.indexOf(sh);if(!obs.passed.every(p=>order.indexOf(p)<idx))st.bad.push('ordre');if(obs.passed.length!==idx)st.bad.push('arrêt/ordre');if(order.slice(0,idx).some(k=>Engine.matching(G,k,trio).length))st.bad.push('joueur sauté');}
  else if(order.some(k=>Engine.matching(G,k,trio).length))st.bad.push('aucune réponse alors que possible');
  st.shows+=shows;Engine.endSuggestion(G,obs);
 },
 simGame(G,st,max=700){
  let s=0;
  while(!G.over&&s++<max){
   const i=G.active,m=G.mems[i],p=G.players[i];
   if(G.phase==='choose'){
    const d=Bots.decide(m,p.canAccuse);
    if(d.type==='accuse')Engine.accuse(G,i,d.trio);else this.simSuggest(G,i,d.trio,st);
   }else if(G.phase==='after'){const t=Bots.afterAccuse(m,p.canAccuse);if(t)Engine.accuse(G,i,t);else G.phase='end';}
   else if(G.phase==='end')Engine.endTurn(G);
  }
  return G.over;
 },
 async run(cb){
  const rows=[],add=(n,ok,d)=>{rows.push({name:n,ok:!!ok,detail:d||''});cb&&cb(rows);};
  const tick=()=>new Promise(r=>setTimeout(r,0));
  add('1. Les 21 cartes existent exactement une fois',CARDS.length===21&&new Set(IDS).size===21&&CAT_IDS.P.length===6&&CAT_IDS.E.length===6&&CAT_IDS.A.length===9,`${CARDS.length} cartes · 6/6/9`);
  let ok2=true,ok3=true,ok4=true;
  for(let r=0;r<300;r++){
   const n=2+r%5,G=Engine.newGame(this.mk(n));
   ok2=ok2&&validTrio(G.secret);
   const all=[...G.secret];G.players.forEach(p=>all.push(...p.hand));
   const sz=G.players.map(p=>p.hand.length);
   ok3=ok3&&all.length===21&&new Set(all).size===21&&Math.max(...sz)-Math.min(...sz)<=1&&sz.reduce((a,b)=>a+b,0)===18;
  }
  add('2. Le dossier secret contient une carte de chaque catégorie',ok2,'300 distributions');
  add('3. Les 18 autres cartes sont toutes distribuées, sans doublon',ok3,'répartition équilibrée pour 2 à 6 joueurs');
  const hv=Engine.newGame({players:[{name:'H',avatar:'🕵️',human:true},{name:'B',avatar:'🦊',human:false,level:'expert'},{name:'C',avatar:'🦉',human:false,level:'normal'}]});
  const js=JSON.stringify(humanView(hv));
  const hidden=[...hv.secret,...hv.players[1].hand,...hv.players[2].hand];
  add('4. Le joueur ne voit pas les cartes secrètes des autres',hidden.every(c=>!js.includes('"'+c+'"')&&!js.includes(c+'|')),'vue publique inspectée');
  let ok5=true;for(let n=2;n<=6;n++){const G=Engine.newGame(this.mk(n));for(let i=0;i<n;i++){const o=Engine.checkOrder(G,i);ok5=ok5&&o.length===n-1&&o.every((j,k)=>j===(i+1+k)%n);}const a=G.active;Engine.endTurn(G);ok5=ok5&&G.active===(a+1)%n;}
  add('5. Les tours et vérifications suivent le sens horaire',ok5,'2 à 6 joueurs');
  { const G=Engine.newGame(this.mk(4));G.players[0].hand=[];G.players[1].hand=[];G.players[2].hand=[];G.players[3].hand=[];
    const trio=['P1','E1','A1'];G.players[1].hand=['P1'];G.players[3].hand=['E1'];G.active=0;
    const st={bad:[],shows:0};this.simSuggest(G,0,trio,st);
    add('6. La vérification commence par le bon joueur',st.bad.length===0&&G.players[1].hand.includes('P1')&&G.log.some(l=>l.txt.includes('J1 montre secrètement')),'J0 demande, J1 répond en premier'); }
  const stAll={bad:[],shows:0};let finished=0,total=0,okMem=true,okCand=true,okBotKnow=true,noWinner=0;const turns={};
  for(const lv of ['facile','normal','expert']){
   for(let n=2;n<=6;n++){
    for(let r=0;r<3;r++){
     const G=Engine.newGame(this.mk(n,lv));
     G.mems.forEach(m=>{okBotKnow=okBotKnow&&Object.keys(m.known).length===m.own.length&&Object.keys(m.known).every(c=>m.own.includes(c))&&!('secret'in m)&&!('hands'in m);});
     const done=this.simGame(G,stAll);total++;if(done)finished++;if(G.winner===null)noWinner++;
     (turns[lv]=turns[lv]||[]).push(G.turn);
     G.mems.forEach((m,bi)=>{
      for(const c in m.known)if(this.truth(G,c)!==m.known[c])okMem=false;
      for(const p in m.notHas)m.notHas[p].forEach(c=>{if(G.players[p].hand.includes(c))okMem=false;});
      m.cons.forEach(k=>{if(!k.cards.some(c=>G.players[k.pid].hand.includes(c)))okMem=false;});
      const st=Bots.state(m);
      for(const c of IDS){const t=this.truth(G,c);if(t!==bi&&!st.cand[c].has(t))okCand=false;}
      if(!st.triples.some(t=>t.every((c,k)=>c===G.secret[k])))okCand=false;
     });
    }
    await tick();
   }
  }
  add('7. Une seule carte maximum est montrée par hypothèse',stAll.bad.indexOf('plusieurs cartes')<0,`${stAll.shows} cartes montrées dans les simulations`);
  add('8. La vérification s\'arrête dès qu\'une carte est montrée (ordre respecté)',stAll.bad.length===0,stAll.bad.length?stAll.bad[0]:'aucune violation');
  add('9. Les bots ne connaissent pas le dossier secret ni les mains adverses',okBotKnow,'mémoire initiale = leurs seules cartes');
  add('10. Les bots mémorisent et déduisent sans jamais se tromper',okMem&&okCand,'cartes connues, refus, contraintes et candidats vérifiés contre la vérité');
  { const G=Engine.newGame(this.mk(3));G.active=0;G.phase='choose';
    const wrong=G.secret.map((c,k)=>k===0?CAT_IDS.P.find(x=>x!==c):c);let thrown=false;
    const r1=Engine.accuse(G,0,wrong);const lost=!G.players[0].canAccuse&&!G.over&&G.phase==='end';
    G.active=0;G.phase='choose';try{Engine.accuse(G,0,G.secret);}catch(e){thrown=true;}
    const H=Engine.newGame(this.mk(3));H.active=1;const r2=Engine.accuse(H,1,H.secret);
    let bad=false;try{Engine.accuse(Engine.newGame(this.mk(3)),0,['P1','P2','A1']);}catch(e){bad=true;}
    add('11. Les accusations sont vérifiées correctement',!r1.correct&&lost&&thrown&&r2.correct&&H.over&&H.winner===1&&bad,'juste, fausse, interdite après erreur, trio invalide'); }
  { const G=Engine.newGame(this.mk(4,'expert'));const st={bad:[],shows:0};for(let k=0;k<6;k++){const i=G.active,d=Bots.decide(G.mems[i],true);if(d.type==='suggest')this.simSuggest(G,i,d.trio,st);G.phase='end';Engine.endTurn(G);}
    const key='ds:test-save';Save.write(G,key);const back=Save.read(key);LS.del(key);
    const same=JSON.stringify(back.players)===JSON.stringify(G.players)&&JSON.stringify(back.secret)===JSON.stringify(G.secret)&&JSON.stringify(back.mems)===JSON.stringify(G.mems)&&back.active===G.active&&back.log.length===G.log.length&&Engine.validate(back);
    const st2={bad:[],shows:0};const cont=this.simGame(back,st2);
    add('12. La sauvegarde restaure exactement la partie',same&&cont,'mains, dossier, mémoires, journal, joueur actif — et la partie restaurée peut être terminée'); }
  add('13. Des parties complètes se terminent à chaque difficulté (2 à 6 joueurs)',finished===total,`${finished}/${total} parties terminées · ${noWinner} sans vainqueur · tours moyens F/N/E : ${['facile','normal','expert'].map(l=>Math.round(turns[l].reduce((a,b)=>a+b,0)/turns[l].length)).join('/')}`);
  const mq=[...document.styleSheets].reduce((a,s)=>{try{return a+[...s.cssRules].filter(r=>r.type===CSSRule.MEDIA_RULE).length;}catch(e){return a;}},0);
  add('14. Interface adaptée au mobile',!!document.querySelector('meta[name=viewport]')&&mq>=3,`viewport + ${mq} règles @media (panneau coulissant < 1000 px)`);
  const dom=$$('[data-act]').map(e=>e.dataset.act),miss=dom.filter(a=>typeof ACTIONS[a]!=='function');
  add('15. Aucun bouton important n\'est factice',miss.length===0&&Object.values(ACTIONS).every(f=>typeof f==='function'),`${dom.length} boutons visibles reliés au moteur${miss.length?' · manquants : '+miss.join(', '):''}`);
  return rows;
 }
};

/* ===== Démarrage ===== */
Settings.set({});
renderWelcome();show('welcome');
window.DossierSecret={Engine,Bots,Tests,Save,Stats,CARDS};
